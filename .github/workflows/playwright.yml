name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: api
            browser: ''
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Restore Playwright browser cache
      if: ${{ matrix.browser != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser
      if: ${{ matrix.browser != '' }}
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Playwright browser tests
      if: ${{ matrix.project != 'api' }}
      run: npx playwright test --project=${{ matrix.project }}
    - name: Run Playwright API tests
      if: ${{ matrix.project == 'api' }}
      env:
        CONTACT_LIST_EMAIL: ${{ secrets.CONTACT_LIST_EMAIL }}
        CONTACT_LIST_PASSWORD: ${{ secrets.CONTACT_LIST_PASSWORD }}
      run: npx playwright test --project=api
    - name: Triage failed Playwright run
      if: ${{ failure() }}
      run: node src/utils/triage-playwright-failure.mjs --results-dir test-results --project ${{ matrix.project }} --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-${{ matrix.project }}
        path: test-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{ matrix.project }}
        path: allure-results/
        retention-days: 30
